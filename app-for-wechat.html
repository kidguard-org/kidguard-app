<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转中...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f7f7; text-align: center; }
        
        /* 微信内的引导遮罩层 */
        .wechat-guide {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            z-index: 9999;
        }
        .wechat-guide .arrow {
            position: absolute;
            right: 25px;
            top: 15px;
            width: 80px;
        }
        .wechat-guide .text {
            margin-top: 120px;
            padding: 0 20px;
            font-size: 18px;
            line-height: 1.8;
        }
        .wechat-guide strong { color: #4CAF50; }

        /* 降级备用展示：二维码及复制链接 */
        .fallback-box {
            margin-top: 50px;
            padding: 20px;
        }
        .qrcode-img { width: 200px; height: 200px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- 微信内打开时显示的遮罩提示 -->
    <div id="wechatGuide" class="wechat-guide">
        <!-- 请准备一张指向右上角的白色或黄色箭头图片 -->
        <img class="arrow" src="https://cdn-icons-png.flaticon.com/512/545/545682.png" alt="箭头指示">
        <div class="text">
            <p>请点击右上角 <strong>「 ... 」</strong></p>
            <p>选择 <strong>「在浏览器打开」</strong> 即可访问</p>
        </div>
    </div>

    <!-- 微信外展示或备用界面 -->
    <div class="fallback-box">
        <p>正在努力加载，请稍候...</p>
    </div>

    <script>
        // 替换为你未备案的目标网址
        var TARGET_URL = "https://app.kidguard.dpdns.org/"; 

        // 判断是否为微信浏览器
        function isWeChat() {
            var ua = navigator.userAgent.toLowerCase();
            return ua.indexOf('micromessenger') !== -1;
        }

        if (isWeChat()) {
            // 在微信内：显示引导遮罩层
            document.getElementById('wechatGuide').style.display = 'block';
        } else {
            // 不在微信内（普通浏览器）：直接自动跳转到目标网址
            window.location.href = TARGET_URL;
        }
    </script>
</body>
</html>
